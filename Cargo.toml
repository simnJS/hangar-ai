# Hangar, native: the whole desktop app in Rust, drawn with iced, with no
# webview in the main process. A kit page or a document that only a browser
# engine can show opens in the separate `hangar-webview` helper.
#
# docs/native/PLAN.md is the map of this workspace and of the port.
[workspace]
resolver = "3"
# The example kits' tabs and the host's test kit are members too: they build
# for the host as well as for wasm32-unknown-unknown, so the workspace's
# checks and tests reach them (docs/native/kits-native.md, "Building a tab").
members = ["crates/*", "examples/kits/*/tab", "crates/hangar-kit-host/tests/probe"]
# The Tauri app this branch replaces, left to read from while the port is
# under way (docs/native/PLAN.md, "Retiring the webview app").
exclude = ["src-tauri"]

[workspace.package]
version = "1.12.1"
authors = ["simnJS"]
license = "MIT"
repository = "https://github.com/hangar-ai/hangar"

[workspace.dependencies]
hangar-core = { path = "crates/hangar-core" }
hangar-theme = { path = "crates/hangar-theme" }
hangar-ui = { path = "crates/hangar-ui" }
hangar-term = { path = "crates/hangar-term" }
hangar-kit-ui = { path = "crates/hangar-kit-ui" }
hangar-kit-sdk = { path = "crates/hangar-kit-sdk" }
hangar-kit-host = { path = "crates/hangar-kit-host" }
hangar-webview = { path = "crates/hangar-webview" }
hangar-i18n = { path = "crates/hangar-i18n" }
hangar-update = { path = "crates/hangar-update" }
hangar-model3d = { path = "crates/hangar-model3d" }

iced = { version = "0.14", features = ["tokio", "advanced", "canvas", "image", "svg", "lazy", "markdown", "highlighter"] }
alacritty_terminal = "0.26"
portable-pty = "0.9.0"
wasmtime = "50"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1.53.1", features = ["rt-multi-thread", "macros", "sync", "time", "process", "io-util"] }
dirs = "6.0.0"
rfd = "0.17"
open = "5.4"
# The version iced's `image` feature already builds; hangar-app writes its
# development screenshots with it.
png = "0.18"
# The browser engine of hangar-webview alone: wry drives the platform's webview
# (WebKitGTK, WebView2, WKWebView) and tao gives it its windows.
wry = "0.57"
tao = "0.37"
# Colours for the preview's source code: bat's syntaxes (what iced's own
# highlighter loads), with the scopes kept so the theme picks the tones.
two-face = { version = "0.4", default-features = false, features = ["syntect-default-fancy"] }
syntect = { version = "5.3", default-features = false, features = ["parsing"] }
http = "1"
unicode-normalization = "0.1"
usvg = { version = "0.45", default-features = false }
iced_test = "0.14"
