# Hangar, native: the whole desktop app in Rust, drawn with iced, with no
# webview in the main process. A kit page or a document that only a browser
# engine can show opens in the separate `hangar-webview` helper.
#
# docs/native/PLAN.md is the map of this workspace and of the port.
[workspace]
resolver = "3"
# The example kits' tabs and the host's test kit are members too: they build
# for the host as well as for wasm32-unknown-unknown, so the workspace's
# checks and tests reach them (docs/native/kits-native.md, "Building a tab").
members = ["crates/*", "examples/kits/*/tab", "crates/hangar-kit-host/tests/probe"]

[workspace.package]
version = "2.2.0-rc.1"
authors = ["simnJS"]
license = "MIT"
repository = "https://github.com/hangar-ai/hangar"

[workspace.dependencies]
hangar-core = { path = "crates/hangar-core" }
hangar-theme = { path = "crates/hangar-theme" }
hangar-ui = { path = "crates/hangar-ui" }
hangar-term = { path = "crates/hangar-term" }
hangar-kit-ui = { path = "crates/hangar-kit-ui" }
hangar-kit-sdk = { path = "crates/hangar-kit-sdk" }
hangar-kit-host = { path = "crates/hangar-kit-host" }
hangar-webview = { path = "crates/hangar-webview" }
hangar-i18n = { path = "crates/hangar-i18n" }
hangar-update = { path = "crates/hangar-update" }
hangar-model3d = { path = "crates/hangar-model3d" }

# `image-without-codecs` rather than `image`: iced's `image` turns on the
# image crate's default formats, every one of them (EXR, TIFF, DDS, HDR, QOI,
# PNM, ICO, farbfeld and an AVIF *encoder*, rav1e), when the app shows PNG,
# JPEG, GIF, WebP and BMP (and AVIF, which it decodes itself). The formats it
# reads are the `image` entry's below, which every crate here shares; the 3D
# view adds the texture formats it reads (hangar-model3d's Cargo.toml).
iced = { version = "0.14", features = ["tokio", "advanced", "canvas", "image-without-codecs", "svg", "lazy", "markdown", "highlighter"] }
alacritty_terminal = "0.26"
portable-pty = "0.9.0"
# A native kit tab is a core module compiled by Cranelift, run with epoch
# interruption and a ResourceLimiter, with wasmtime's on-disk code cache
# (hangar-kit-host's runtime.rs): only what that needs, and `threads`, which
# `Config::wasm_threads` (set to false there) is behind. Off: the text format
# (`wat`, the `wast` parser), the component model, the GC proposal, async,
# the pooling allocator, profiling, coredumps, the debugger hooks and the
# addr2line/demangle of a trap's frames.
wasmtime = { version = "50", default-features = false, features = ["runtime", "cranelift", "cache", "std", "parallel-compilation", "backtrace", "threads"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# `signal`: the app quits in order on SIGTERM, SIGINT and SIGHUP (hangar-app's
# app.rs), as when its main window closes.
tokio = { version = "1.53.1", features = ["rt-multi-thread", "macros", "sync", "time", "process", "io-util", "signal"] }
dirs = "6.0.0"
rfd = "0.17"
open = "5.4"
# The version iced's `image` feature already builds; hangar-app writes its
# development screenshots with it.
png = "0.18"
# The browser engine of hangar-webview alone: wry drives the platform's webview
# (WebKitGTK, WebView2, WKWebView) and tao gives it its windows.
wry = "0.57"
tao = "0.37"
# Colours for the preview's source code: bat's syntaxes (what iced's own
# highlighter loads), with the scopes kept so the theme picks the tones.
two-face = { version = "0.4", default-features = false, features = ["syntect-default-fancy"] }
syntect = { version = "5.3", default-features = false, features = ["parsing"] }
http = "1"
unicode-normalization = "0.1"
# Dates in the local time zone (hangar-core and hangar-update already use it).
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
usvg = { version = "0.45", default-features = false }
# The frames of an animated GIF or WebP, which the preview plays itself: iced
# draws still pictures only. The crate and both decoders are already built
# for iced's `image` feature and hangar-model3d; only the animation API of
# them is used here, and the headers of the other formats the preview shows
# (PNG, JPEG, BMP), to size a picture before the renderer decodes it.
image = { version = "0.25", default-features = false, features = ["gif", "webp", "png", "jpeg", "bmp"] }
# AVIF, which the preview reads itself (iced's image feature has no AV1
# decoder): the container by `avif-parse`, the pictures by `re_rav1d`, a Rust
# port of dav1d. Its assembly is off, so no `nasm` is needed to build the
# app: a still picture decodes in a moment without it.
avif-parse = "2"
re_rav1d = { version = "0.1", default-features = false, features = ["bitdepth_8", "bitdepth_16"] }
# The clipboard with pictures in it: iced's own is text only, and the 3D
# view copies its capture as an image. The Wayland feature lets it use a
# compositor's data-control protocol; X11 (XWayland) is what it falls back on.
arboard = { version = "3", default-features = false, features = ["image-data", "wayland-data-control"] }
# The version hangar-core and hangar-model3d already build: hangar-core's
# `model_save_png` takes a capture as base64.
base64 = "0.22"
# The picture a native kit tab exports (`canvas.export`, hangar-kit-host's
# paint.rs), drawn off screen: the rasteriser iced's tiny-skia backend
# already builds, and Inter's glyphs by the crate winit's Wayland
# decorations already build.
tiny-skia = { version = "0.11", default-features = false, features = ["std", "simd"] }
ab_glyph = "0.2"
iced_test = "0.14"
# iced's `UserInterface`, which iced itself builds: hangar-app's development
# screenshots lay the main window's view out and draw it off screen with it.
iced_runtime = "0.14"
# The version hangar-core already builds: hangar-app's orchestration engine
# reads plans with it.
regex = "1"
# The ids the store gives new workspaces, panes, folders and saved commands,
# as `crypto.randomUUID()` gave them (v4); hangar-core already builds it.
uuid = { version = "1.24.0", features = ["v4"] }

# The AV1 decoder behind AVIF previews is unusably slow unoptimised; a debug
# build of the app optimises it alone (release builds are unaffected).
[profile.dev.package.re_rav1d]
opt-level = 2

# What the release workflow and the packaging scripts build: `cargo build
# --profile dist`, into target/dist. `--release` stays the default profile,
# which builds a cold hangar-app in a fifth of the time, for working on the
# app; dist is for what people download. Measured on hangar-app (32 cores,
# docs/native/PACKAGING.md, "The dist profile"): the executable is a third
# smaller (119 MB to 79 MB, hangar-node 17 MB to 10 MB, which the desktop
# uploads to every node), parsing a pane's output is about 4% faster and the
# app holds 5 MB less; the time to the first prompts does not move. The cost
# is the build: 7 minutes cold instead of 1½, and 5 minutes instead of 30
# seconds after a one-line change, which is why it is not `--release`.
# Thin LTO alone changed nothing; with one codegen unit it was a quarter
# smaller but no faster, and fat LTO with one unit beat it on every count.
#
# The symbol table stays: with `strip = "symbols"` a panic's backtrace is
# addresses only, and the function names in it are what a bug report needs.
# "debuginfo" is what release already does without debug info; it is
# written out so that nobody takes it for an oversight. Panics still unwind:
# the app catches them (catch_unwind) around decoders, kit tabs and jobs.
[profile.dist]
inherits = "release"
lto = "fat"
codegen-units = 1
strip = "debuginfo"

# Optimised for size: crates that run once in a while, not every frame or
# every byte of a pane's output. Cranelift, regalloc2 and wasmparser compile a
# kit tab's module (once, then wasmtime's cache answers); naga translates the
# renderers' shaders at start; zbus and zvariant are a D-Bus call now and then
# (notifications, the keychain, the file manager, a pane's systemd scope).
# Measured on a dist build (docs/native/PACKAGING.md, "What is in the
# executable"): a cold kit compile takes +1 to +7 ms (in parallel, as the app
# compiles), the renderers' shaders +0.25 ms at start.
[profile.dist.package.cranelift-codegen]
opt-level = "s"
[profile.dist.package.cranelift-assembler-x64]
opt-level = "s"
[profile.dist.package.cranelift-frontend]
opt-level = "s"
[profile.dist.package.wasmtime-internal-cranelift]
opt-level = "s"
[profile.dist.package.regalloc2]
opt-level = "s"
[profile.dist.package.wasmparser]
opt-level = "s"
[profile.dist.package.wasmtime-environ]
opt-level = "s"
[profile.dist.package.naga]
opt-level = "s"
[profile.dist.package.zbus]
opt-level = "s"
[profile.dist.package.zvariant]
opt-level = "s"

# A second set, the same way: what reads a glTF or an OBJ model (an OBJ of
# 36 MB loads in the same time; STL, FBX and PLY readers stay at full speed, a
# 50 MB STL took a fifth longer), TLS and HTTP for updates and dictation,
# the keychain and notifications over D-Bus, Hangar Mobile's push and QR
# code, the Discord presence, and wasmtime's code cache with the zstd it
# writes it with.
[profile.dist.package.gltf]
opt-level = "s"
[profile.dist.package.gltf-json]
opt-level = "s"
[profile.dist.package.tobj]
opt-level = "s"
[profile.dist.package.secret-service]
opt-level = "s"
[profile.dist.package.zbus_names]
opt-level = "s"
[profile.dist.package.notify-rust]
opt-level = "s"
[profile.dist.package.web-push-native]
opt-level = "s"
[profile.dist.package.ece-native]
opt-level = "s"
[profile.dist.package.p256]
opt-level = "s"
[profile.dist.package.elliptic-curve]
opt-level = "s"
[profile.dist.package.qrcode]
opt-level = "s"
[profile.dist.package.ureq]
opt-level = "s"
[profile.dist.package.ureq-proto]
opt-level = "s"
[profile.dist.package.rustls]
opt-level = "s"
[profile.dist.package.rustls-webpki]
opt-level = "s"
[profile.dist.package.wasmtime-internal-cache]
opt-level = "s"
[profile.dist.package.zstd-sys]
opt-level = "s"
[profile.dist.package.keyring-core]
opt-level = "s"
[profile.dist.package.discord-rich-presence]
opt-level = "s"
