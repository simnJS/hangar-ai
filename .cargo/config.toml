# The C runtime linked into the Windows executables rather than taken from the
# Visual C++ Redistributable: a fresh Windows does not have VCRUNTIME140.dll or
# MSVCP140.dll, and an executable that imports them exits at once with
# STATUS_DLL_NOT_FOUND (0xC0000135). The Tauri build linked it statically too.
# cc and cmake builds (whisper.cpp, ...) follow the same flag (/MT).
[target.x86_64-pc-windows-msvc]
rustflags = ["-C", "target-feature=+crt-static"]

[target.aarch64-pc-windows-msvc]
rustflags = ["-C", "target-feature=+crt-static"]
