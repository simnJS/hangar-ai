name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag to publish (e.g. v0.1.0)"
        required: true

permissions:
  contents: write

env:
  # In CI every build is from scratch, so incremental only pays for dependency
  # tracking nobody reuses — and it is what makes the cached target directory
  # big enough for restoring it to cost more than it saves.
  CARGO_INCREMENTAL: 0

jobs:
  build:
    strategy:
      # All three at once. They no longer contend for `latest.json` — the
      # publish job below assembles it alone, from the signatures they leave
      # on the release — so a release now takes as long as its slowest
      # platform rather than the sum of all of them.
      fail-fast: false
      matrix:
        include:
          # One universal binary rather than two downloads: an Apple Silicon
          # user picking the Intel build gets a working app either way, and
          # nobody has to know which one they are on.
          - platform: macos-latest
            args: --target universal-apple-darwin
            rust-targets: aarch64-apple-darwin,x86_64-apple-darwin
          - platform: windows-latest
            args: ""
            rust-targets: ""
          # Not `ubuntu-latest`: an AppImage links against the glibc of the
          # machine that built it, so building on a newer Ubuntu quietly drops
          # every distribution older than it.
          - platform: ubuntu-22.04
            args: ""
            rust-targets: ""

    runs-on: ${{ matrix.platform }}
    env:
      # Read by the guard on the signing step below, and by the release notes.
      # Left empty until an Apple certificate is configured, which is what makes
      # the macOS job fall back to an unsigned build rather than failing.
      APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
    steps:
      - uses: actions/checkout@v4

      # The Windows runner spends about twice as long on this crate as the
      # other two, and most of the difference is Defender opening every one of
      # the tens of thousands of files cargo writes. The runner is already
      # ephemeral and already runs whatever this workflow says, so scanning the
      # build it is about to produce buys nothing.
      - name: Keep Defender out of the build
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          Add-MpPreference -ExclusionPath "${{ github.workspace }}"
          Add-MpPreference -ExclusionPath "$env:USERPROFILE\.cargo"
          Add-MpPreference -ExclusionProcess "rustc.exe"
          Add-MpPreference -ExclusionProcess "cargo.exe"
          Add-MpPreference -ExclusionProcess "link.exe"

      # Linux has no system WebView, and `tauri-build` needs it at compile
      # time. `patchelf` is what the AppImage bundler rewrites the binary with.
      # The last two are dictation: `libasound2-dev` is the ALSA header set cpal
      # captures the microphone through, and `libclang-dev` is what whisper.cpp's
      # bindings are generated with. Both fail the build, not the run.
      - name: Install Linux build dependencies
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            libxdo-dev \
            libssl-dev \
            libasound2-dev \
            libclang-dev \
            patchelf

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.rust-targets }}

      # Worth having for a re-run of the same tag, but not much more: a cache
      # written under a tag ref is not readable from the next tag, so a release
      # normally compiles from scratch whatever this restores. Warming it would
      # mean a full release build on every push to main, which costs more than
      # it saves at this rate of releasing.
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: ./src-tauri -> target

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # Signing and notarisation are driven entirely by the environment, and an
      # empty-but-present variable reads as "sign with this" rather than "do not
      # sign" — which fails the build instead of skipping the step. They are
      # exported only once the certificate is actually configured, so a clone
      # without Apple credentials still gets a (unsigned) .dmg out of this job.
      - name: Enable Apple signing and notarisation
        if: matrix.platform == 'macos-latest' && env.APPLE_CERTIFICATE != ''
        env:
          CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          ID: ${{ secrets.APPLE_ID }}
          APP_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          {
            echo "APPLE_CERTIFICATE_PASSWORD=$CERTIFICATE_PASSWORD"
            echo "APPLE_SIGNING_IDENTITY=$SIGNING_IDENTITY"
            echo "APPLE_ID=$ID"
            echo "APPLE_PASSWORD=$APP_PASSWORD"
            echo "APPLE_TEAM_ID=$TEAM_ID"
          } >> "$GITHUB_ENV"

      # Builds the installers and, because the signing key is present, the
      # `.sig` next to each updater bundle. Without these secrets the release
      # still succeeds but auto-update will reject the artifacts.
      #
      # The three platforms publish to the same release: whichever job gets
      # there first creates it, the rest add their assets to it.
      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          tagName: ${{ github.event.inputs.tag || github.ref_name }}
          releaseName: Hangar.AI ${{ github.event.inputs.tag || github.ref_name }}
          releaseBody: |
            - **Windows** — `.exe` or `.msi` under **Assets**. Requires WebView2,
              which ships with Windows 11.
            - **macOS** — the `.dmg`, universal for Apple Silicon and Intel.${{ env.APPLE_CERTIFICATE == '' && ' The build is unsigned, so the first launch is right-click → **Open**.' || '' }}
            - **Linux** — the `.AppImage` runs anywhere; the `.deb` and `.rpm`
              are there for a package manager. Needs WebKitGTK 4.1, which every
              current distribution packages.
          args: ${{ matrix.args }}
          # Held as a draft until every platform has landed, then published by
          # the job below. A half-built release under /releases/latest/ is one
          # a visitor downloads the wrong half of.
          releaseDraft: true
          prerelease: false
          # `latest.json` is assembled once, by the job below. Left to this
          # action, each platform would build it by reading the copy already on
          # the release and writing the result back — a read-modify-write with
          # no lock, which is only safe while the jobs are serialised. Taking it
          # away from them is what lets all three run at once.
          includeUpdaterJson: false

  # The single writer of `latest.json`, and the only thing that publishes.
  # Everything the updater relies on is decided here, once, with all three
  # platforms already on the release.
  publish:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Assemble latest.json and publish
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.event.inputs.tag || github.ref_name }}
        run: |
          set -euo pipefail

          # Resolved from the list rather than with `gh release view`, whose
          # by-tag endpoint does not return drafts.
          id=$(gh api "repos/$GITHUB_REPOSITORY/releases?per_page=100" \
                --jq 'map(select(.tag_name == env.TAG)) | .[0].id // empty')
          if [ -z "$id" ]; then
            echo "no release found for tag $TAG" >&2
            exit 1
          fi

          assets=$(gh api "repos/$GITHUB_REPOSITORY/releases/$id/assets?per_page=100")
          platforms='{}'

          # Every updater bundle leaves a `.sig` beside it, so the signatures
          # are the list of what can actually be updated to — a `.deb` or a
          # `.dmg` has none and is a download only. The bundle a signature
          # belongs to is its own name without the suffix, and the extension
          # says which platform keys it answers for.
          #
          # Both the plain key and the per-bundle one are written, as
          # tauri-action did: an app installed by an older release polls for
          # the name it already knows.
          while read -r asset_id name; do
            bundle="${name%.sig}"
            case "$bundle" in
              *.app.tar.gz) keys="darwin-aarch64 darwin-x86_64 darwin-aarch64-app darwin-x86_64-app" ;;
              # The AppImage takes the plain linux key: it is the one bundle
              # that can replace itself in place, which is what the updater
              # does. The other two are listed under their own name for an
              # install that came from a package manager.
              *.AppImage)   keys="linux-x86_64 linux-x86_64-appimage" ;;
              *.deb)        keys="linux-x86_64-deb" ;;
              *.rpm)        keys="linux-x86_64-rpm" ;;
              *.msi)        keys="windows-x86_64 windows-x86_64-msi" ;;
              *-setup.exe)  keys="windows-x86_64-nsis" ;;
              *)            echo "::warning::no platform key for $bundle"; continue ;;
            esac
            signature=$(gh api -H "Accept: application/octet-stream" \
                          "repos/$GITHUB_REPOSITORY/releases/assets/$asset_id")
            url="https://github.com/$GITHUB_REPOSITORY/releases/download/$TAG/$bundle"
            for key in $keys; do
              platforms=$(jq -c --arg k "$key" --arg s "$signature" --arg u "$url" \
                '.[$k] = { signature: $s, url: $u }' <<<"$platforms")
            done
          done < <(jq -r '.[] | select(.name | endswith(".sig")) | "\(.id) \(.name)"' <<<"$assets")

          # A `latest.json` missing a platform is exactly the silent failure
          # this job exists to prevent, and one missing all of them means the
          # signing key never reached the builds. Neither gets published.
          for required in darwin-aarch64 linux-x86_64 windows-x86_64; do
            if [ "$(jq --arg k "$required" 'has($k)' <<<"$platforms")" != "true" ]; then
              echo "latest.json would ship without $required" >&2
              exit 1
            fi
          done

          jq -n --arg v "${TAG#v}" \
                --arg n "$(gh api "repos/$GITHUB_REPOSITORY/releases/$id" --jq .body)" \
                --arg d "$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
                --argjson p "$platforms" \
            '{ version: $v, notes: $n, pub_date: $d, platforms: $p }' > latest.json
          jq -r '.platforms | keys[]' latest.json | sed 's/^/  /'

          # Replaced rather than added, so re-running this job is harmless: an
          # asset name is unique per release and the upload would be refused.
          old=$(jq -r 'first(.[] | select(.name == "latest.json") | .id) // empty' <<<"$assets")
          if [ -n "$old" ]; then
            gh api -X DELETE "repos/$GITHUB_REPOSITORY/releases/assets/$old"
          fi
          gh api --method POST \
            "https://uploads.github.com/repos/$GITHUB_REPOSITORY/releases/$id/assets?name=latest.json" \
            --header "Content-Type: application/json" \
            --input latest.json > /dev/null

          # Publishing is what moves the release under /releases/latest/, which
          # is where the updater polls. It happens last, with the json complete.
          # `draft` is a boolean and `make_latest` a string, per the REST API.
          gh api -X PATCH "repos/$GITHUB_REPOSITORY/releases/$id" \
            -F draft=false -f make_latest=true
