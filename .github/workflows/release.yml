name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag to publish (e.g. v0.1.0)"
        required: true

permissions:
  contents: write

env:
  # In CI every build is from scratch, so incremental only pays for dependency
  # tracking nobody reuses — and it is what makes the cached target directory
  # big enough for restoring it to cost more than it saves.
  CARGO_INCREMENTAL: 0
  # The packaging tools, pinned. cargo-packager is pre-1.0 and what it writes
  # (file names, folder layouts, what it downloads) has moved between releases;
  # a release is not the day to find out. Bumping one is a change to try with
  # docs/native/PACKAGING.md's local steps first.
  CARGO_PACKAGER_VERSION: "0.11.8"
  CARGO_GENERATE_RPM_VERSION: "0.21.1"

# What a release is made of, and why it is done this way, is in
# docs/native/PACKAGING.md. In short: the build jobs make the installers
# (packaging/*/build.sh, which this file only calls, so the same commands can be
# run on a developer's machine) and put them on a draft release; the last job
# signs the ones the updater downloads, writes latest.json, checks the result
# the way an install will, and publishes.
jobs:
  # The one place a release is created.
  #
  # Letting the three build jobs race for it — first one creates, the others
  # attach to what they find — works only while they finish far enough apart.
  # When they do not, two releases appear under the same tag with the assets
  # split between them, and the publish job below refuses a `latest.json` that
  # is missing whichever platform landed in the other one. Creating it once,
  # before anything builds, is what removes the race rather than narrowing it.
  draft:
    runs-on: ubuntu-latest
    outputs:
      release_id: ${{ steps.create.outputs.id }}
    steps:
      - name: Create the draft release
        id: create
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.event.inputs.tag || github.ref_name }}
          NOTES: |
            - **Windows** — the `.exe` under **Assets**. Installs for you alone,
              with no administrator rights. Unsigned, so SmartScreen warns on
              first run: **More info** → **Run anyway**. HTML kit tabs and PDF
              previews use WebView2, which ships with Windows 11; the installer
              fetches it on a Windows 10 that has none.
            - **macOS** — the `.dmg`, universal for Apple Silicon and Intel.${{ secrets.APPLE_CERTIFICATE == '' && ' The build is unsigned, so the first launch is right-click → **Open**.' || '' }}
            - **Linux** — the `.AppImage` runs without installing on
              distributions with glibc 2.35 or later (2022 on); the `.deb` and
              `.rpm` are there for a package manager, and bring WebKitGTK 4.1
              with them. HTML kit tabs and PDF previews need WebKitGTK 4.1, so
              with the AppImage install `libwebkit2gtk-4.1-0` (Debian, Ubuntu)
              or `webkit2gtk4.1` (Fedora) if your system lacks it.
        run: |
          set -euo pipefail

          # A re-run of a failed release finds its own draft from the first
          # attempt; reusing it keeps whatever assets already uploaded rather
          # than starting a second release beside the first.
          id=$(gh api "repos/$GITHUB_REPOSITORY/releases?per_page=100" \
                --jq 'map(select(.tag_name == env.TAG)) | .[0].id // empty')

          if [ -z "$id" ]; then
            id=$(jq -n --arg tag "$TAG" --arg body "$NOTES" \
                  '{ tag_name: $tag, name: ("Hangar.AI " + $tag),
                     body: $body, draft: true, prerelease: false }' \
                 | gh api --method POST "repos/$GITHUB_REPOSITORY/releases" \
                     --input - --jq .id)
            echo "created release $id for $TAG"
          else
            echo "reusing release $id for $TAG"
          fi

          echo "id=$id" >> "$GITHUB_OUTPUT"

  # hangar-node, the headless daemon a Hangar node runs (docs/native/nodes.md),
  # for Linux x86_64 and arm64. The desktop uploads it to a node over SSH, and
  # looks for it beside its own executable, so every desktop package carries
  # both - a Mac or a Windows desktop drives Linux nodes too - which is why this
  # runs before the build jobs and they download what it makes.
  #
  # Both on ubuntu-22.04, like the AppImage: the node links the glibc of the
  # machine that built it, so 22.04 keeps it running on glibc 2.35 and later.
  # The arm64 one is cross-built there (gcc-aarch64-linux-gnu, with 22.04's own
  # arm64 glibc) rather than built on an arm64 runner: the arm runners are not
  # available to every repository or plan, a job waiting for one would hold the
  # whole release, and the same x86_64 runner and toolchain for both is one
  # thing less that differs between them. hangar-node's dependencies are
  # headless (no ALSA, WebKit or whisper), so a C cross-compiler is all it needs.
  node:
    needs: draft
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x86_64
            target: x86_64-unknown-linux-gnu
          - arch: aarch64
            target: aarch64-unknown-linux-gnu
    runs-on: ubuntu-22.04
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      RELEASE_ID: ${{ needs.draft.outputs.release_id }}
      # Only used when the target is aarch64; cargo and cc read them by target.
      CARGO_TARGET_AARCH64_UNKNOWN_LINUX_GNU_LINKER: aarch64-linux-gnu-gcc
      CC_aarch64_unknown_linux_gnu: aarch64-linux-gnu-gcc
    steps:
      - uses: actions/checkout@v4

      - name: Install the arm64 cross compiler
        if: matrix.arch == 'aarch64'
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-aarch64-linux-gnu libc6-dev-arm64-cross

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - uses: swatinem/rust-cache@v2
        with:
          key: node-${{ matrix.arch }}

      # The dist profile (fat LTO, one codegen unit: the workspace Cargo.toml
      # says why), as the app's: the file the desktop uploads to every node is
      # a third smaller for it.
      - name: Build hangar-node
        run: cargo build --profile dist --locked --target "${{ matrix.target }}" -p hangar-node

      # Stripped (dist builds keep the symbol table, a sixth of this file, for
      # backtraces; a node has no use for it) and named as the
      # desktop looks for it. `file` and the glibc check are what stand between
      # a wrong binary and a release: one for the wrong machine, or one that
      # wants a newer glibc than 2.35, would only fail on someone's server.
      - name: Strip and check
        run: |
          set -euo pipefail
          mkdir -p out
          src="target/${{ matrix.target }}/dist/hangar-node"
          prefix=""
          [ "${{ matrix.arch }}" = "aarch64" ] && prefix="aarch64-linux-gnu-"
          strip="${prefix}strip"
          "$strip" -o "out/hangar-node-${{ matrix.arch }}" "$src"
          file "out/hangar-node-${{ matrix.arch }}"
          machine="${{ matrix.arch == 'x86_64' && 'x86-64' || 'ARM aarch64' }}"
          file "out/hangar-node-${{ matrix.arch }}" | grep -q "$machine"
          newest=$("${prefix}objdump" -T "out/hangar-node-${{ matrix.arch }}" | grep -o 'GLIBC_[0-9.]*' | sort -uV | tail -1)
          echo "newest glibc symbol: $newest"
          [ "$(printf '%s\nGLIBC_2.35\n' "$newest" | sort -V | tail -1)" = "GLIBC_2.35" ]
          if [ "${{ matrix.arch }}" = "x86_64" ]; then
            "out/hangar-node-x86_64" version
          fi

      # What the build jobs pack into the installers.
      - uses: actions/upload-artifact@v4
        with:
          name: hangar-node-${{ matrix.arch }}
          path: out/hangar-node-${{ matrix.arch }}
          if-no-files-found: error

      # And on the release as a download of its own, for a node that is set up
      # by hand: hangar-node-<version>-linux-<arch>.
      - name: Upload to the draft release
        run: |
          set -euo pipefail
          pkgid="$(cargo pkgid -p hangar-node)"
          version="${pkgid##*[#@]}"
          [ -n "$version" ] && [ "$version" != "$pkgid" ]
          cp "out/hangar-node-${{ matrix.arch }}" "out/hangar-node-${version}-linux-${{ matrix.arch }}"
          crates/hangar-app/packaging/upload-assets.sh "$RELEASE_ID" "out/hangar-node-${version}-linux-${{ matrix.arch }}"

  build:
    needs: [draft, node]
    strategy:
      # All three at once. They do not contend for anything — the publish job
      # below is the only writer of `latest.json` — so a release takes as long
      # as its slowest platform rather than the sum of all of them.
      fail-fast: false
      matrix:
        include:
          # One universal app rather than two downloads: an Apple Silicon user
          # picking the Intel build gets a working app either way, and nobody
          # has to know which one they are on.
          - platform: macos-latest
            rust-targets: aarch64-apple-darwin,x86_64-apple-darwin
          - platform: windows-latest
            rust-targets: ""
          # Not `ubuntu-latest`: an AppImage links against the glibc of the
          # machine that built it, so building on a newer Ubuntu quietly drops
          # every distribution older than it.
          - platform: ubuntu-22.04
            rust-targets: ""

    runs-on: ${{ matrix.platform }}
    defaults:
      run:
        # The packaging scripts are bash, and so is the rest, on every system.
        shell: bash
    env:
      # Read by the guard on the signing step below, and by the release notes.
      # Left empty until an Apple certificate is configured, which is what makes
      # the macOS job fall back to an unsigned build rather than failing.
      APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      RELEASE_ID: ${{ needs.draft.outputs.release_id }}
      # The tools the AppImage step downloads are AppImages themselves. This
      # makes each unpack and run itself rather than mount, so the step does not
      # depend on whether the runner image has FUSE.
      APPIMAGE_EXTRACT_AND_RUN: 1
    steps:
      - uses: actions/checkout@v4

      # The Windows runner spends about twice as long on this crate as the
      # other two, and most of the difference is Defender opening every one of
      # the tens of thousands of files cargo writes. The runner is already
      # ephemeral and already runs whatever this workflow says, so scanning the
      # build it is about to produce buys nothing.
      - name: Keep Defender out of the build
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          Add-MpPreference -ExclusionPath "${{ github.workspace }}"
          Add-MpPreference -ExclusionPath "$env:USERPROFILE\.cargo"
          Add-MpPreference -ExclusionProcess "rustc.exe"
          Add-MpPreference -ExclusionProcess "cargo.exe"
          Add-MpPreference -ExclusionProcess "link.exe"

      # The window needs nothing at build time on Linux: winit loads Wayland, X11
      # and xkbcommon when it starts. What is needed is WebKitGTK, for the
      # webview helper's engine only, and for dictation: `libasound2-dev` is the
      # ALSA header set cpal captures the microphone through, and `libclang-dev`
      # is what whisper.cpp's bindings are generated with. All of them fail the
      # build, not the run. (The list ci.yml builds the workspace with.)
      - name: Install Linux build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libasound2-dev \
            libclang-dev \
            libssl-dev

      # hangar-node for Linux x86_64 and arm64, from the `node` job, where the
      # packaging scripts take them from (they refuse to package without).
      - uses: actions/download-artifact@v4
        with:
          pattern: hangar-node-*
          path: target/node
          merge-multiple: true

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.rust-targets }}

      # Worth having for a re-run of the same tag, but not much more: a cache
      # written under a tag ref is not readable from the next tag, so a release
      # normally compiles from scratch whatever this restores. Warming it would
      # mean a full release build on every push to main, which costs more than
      # it saves at this rate of releasing.
      - uses: swatinem/rust-cache@v2

      # Hangar Mobile, the phone app, is compiled into the executable from
      # dist-mobile/. Without it the build still succeeds and every phone gets
      # a page saying the app is missing, so this job fails instead: the release
      # stays a draft and nothing reaches /releases/latest/. It is checked twice:
      # here that the folder is whole, and after the build that the executable
      # took it in.
      - name: Build Hangar Mobile
        run: |
          pnpm install --frozen-lockfile
          pnpm mobile:build
          crates/hangar-app/packaging/check-mobile.sh

      # Signing and notarisation are driven entirely by the environment, and an
      # empty-but-present variable reads as "sign with this" rather than "do not
      # sign" — which fails the build instead of skipping the step. They are
      # exported only once the certificate is actually configured, so a clone
      # without Apple credentials still gets a (unsigned) .dmg out of this job.
      # cargo-packager reads these names itself.
      - name: Enable Apple signing and notarisation
        if: runner.os == 'macOS' && env.APPLE_CERTIFICATE != ''
        env:
          CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          ID: ${{ secrets.APPLE_ID }}
          APP_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          {
            echo "APPLE_CERTIFICATE_PASSWORD=$CERTIFICATE_PASSWORD"
            echo "APPLE_ID=$ID"
            echo "APPLE_PASSWORD=$APP_PASSWORD"
            echo "APPLE_TEAM_ID=$TEAM_ID"
          } >> "$GITHUB_ENV"

      # Unlike Tauri's bundler, cargo-packager takes the identity to sign with
      # from its configuration and not from the environment, so it is written
      # into the copy of the manifest this job has, never into the repository.
      - name: Name the signing certificate to the packager
        if: runner.os == 'macOS' && env.APPLE_CERTIFICATE != ''
        env:
          SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
        run: |
          perl -0pi -e 's/(\[package\.metadata\.packager\.macos\]\n)/$1signingIdentity = "$ENV{SIGNING_IDENTITY}"\n/' crates/hangar-app/Cargo.toml
          grep -q '^signingIdentity = ".\+"' crates/hangar-app/Cargo.toml

      # whisper.cpp is compiled from source here, and ggml's default is to
      # build for the machine doing the building. GitHub hands out whatever
      # runner it has: on one with AVX-512 that produces a release that dies
      # with an illegal instruction on every CPU without it — which is most
      # consumer Intel since 2021 — and on the next runner it does not. A
      # release that works depending on which machine built it is not a release.
      #
      # AVX2 instead, which is 2013 onwards and covers anything that can run
      # this app. It is not a compromise on speed: measured on the dictation
      # path, the AVX-512 build and this one are within noise of each other
      # (4.51s vs 4.67s), because what the work is bound by is not vector width.
      #
      # x86 only. The macOS bundle also targets arm64, where none of these mean
      # anything and GGML_NATIVE is what picks the NEON features instead.
      - name: Pin whisper.cpp to a portable instruction set
        if: runner.os != 'macOS'
        run: |
          {
            echo "GGML_NATIVE=OFF"
            echo "GGML_SSE42=ON"
            echo "GGML_AVX=ON"
            echo "GGML_AVX2=ON"
            echo "GGML_FMA=ON"
            echo "GGML_F16C=ON"
            echo "GGML_BMI2=ON"
          } >> "$GITHUB_ENV"

      # What `bundle.macOS.minimumSystemVersion` did for the Tauri build: the
      # oldest macOS the executables are compiled to run on, which also tells
      # the C++ of whisper.cpp what it may call.
      - name: Target macOS 10.15
        if: runner.os == 'macOS'
        run: echo "MACOSX_DEPLOYMENT_TARGET=10.15" >> "$GITHUB_ENV"

      # Two builds, the app and then the helper, rather than one with the
      # helper's engine feature on: the app must not be built with it, so that
      # the main executable links no browser engine at all. The helper is the
      # only thing that links WebKitGTK, WebView2 or WKWebView.
      #
      # With the dist profile, not `--release`: fat LTO and one codegen unit,
      # which make the executable a third smaller and parsing a pane's output a
      # few percent faster. It is the slowest part of this job: on 32 cores a
      # cold hangar-app takes 7 minutes instead of 1½, most of it the single
      # LTO step, so expect the same few extra minutes per build here (no
      # timeout is set; the job's default is 6 hours). The numbers and the
      # variants that lost are in docs/native/PACKAGING.md, "The dist profile".
      - name: Build
        run: |
          if [ "$RUNNER_OS" = "macOS" ]; then
            for target in aarch64-apple-darwin x86_64-apple-darwin; do
              cargo build --profile dist --locked --target "$target" -p hangar-app
              cargo build --profile dist --locked --target "$target" -p hangar-webview --features engine
              crates/hangar-app/packaging/check-mobile.sh "target/$target/dist/hangar-ai"
            done
          else
            cargo build --profile dist --locked -p hangar-app
            cargo build --profile dist --locked -p hangar-webview --features engine
            crates/hangar-app/packaging/check-mobile.sh "target/dist/hangar-ai${{ runner.os == 'Windows' && '.exe' || '' }}"
          fi

      # Linux and macOS are packaged by cargo-packager. Windows is not: its
      # installer is the Tauri bundler's NSIS script with Hangar's pages and the
      # update behaviour the updater relies on, which cargo-packager's older fork
      # of that script does not have (docs/native/PACKAGING.md).
      - name: Install the packaging tools
        if: runner.os != 'Windows'
        run: |
          cargo install cargo-packager --version "$CARGO_PACKAGER_VERSION" --locked
          if [ "$RUNNER_OS" = "Linux" ]; then
            cargo install cargo-generate-rpm --version "$CARGO_GENERATE_RPM_VERSION" --locked
          fi

      # NSIS itself, as the Tauri bundler fetched it: the same archive, checked
      # against the same hash.
      - name: Install NSIS
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $zip = Join-Path $env:RUNNER_TEMP "nsis-3.11.zip"
          Invoke-WebRequest -UseBasicParsing -OutFile $zip `
            -Uri "https://github.com/tauri-apps/binary-releases/releases/download/nsis-3.11/nsis-3.11.zip"
          $hash = (Get-FileHash -Algorithm SHA1 $zip).Hash
          if ($hash -ne "EF7FF767E5CBD9EDD22ADD3A32C9B8F4500BB10D") { throw "nsis-3.11.zip has hash $hash" }
          Expand-Archive -Path $zip -DestinationPath $env:RUNNER_TEMP
          $makensis = (Join-Path $env:RUNNER_TEMP "nsis-3.11/makensis.exe") -replace '\\', '/'
          if (-not (Test-Path $makensis)) { throw "no makensis.exe in the NSIS archive" }
          "MAKENSIS=$makensis" >> $env:GITHUB_ENV

      - name: Package
        run: |
          case "$RUNNER_OS" in
            Linux)   crates/hangar-app/packaging/linux/build.sh target/packager ;;
            macOS)   crates/hangar-app/packaging/macos/build.sh target/packager ;;
            Windows) crates/hangar-app/packaging/windows/build.sh target/dist target/packager ;;
          esac

      # Into the release the `draft` job made. Naming it by id rather than by
      # tag is what keeps three parallel jobs on one release: with an id there
      # is nothing left to look up, and nothing to lose a race over. The release
      # stays a draft until the job below publishes it — a half-built release
      # under /releases/latest/ is one a visitor downloads the wrong half of.
      - name: Upload to the draft release
        run: |
          cd target/packager
          case "$RUNNER_OS" in
            Linux)   files=(Hangar.AI_*_amd64.AppImage Hangar.AI_*_amd64.deb Hangar.AI-*.rpm) ;;
            macOS)   files=(Hangar.AI_*_universal.dmg Hangar.AI_universal.app.tar.gz) ;;
            Windows) files=(Hangar.AI_*_x64-setup.exe) ;;
          esac
          "$GITHUB_WORKSPACE/crates/hangar-app/packaging/upload-assets.sh" "$RELEASE_ID" "${files[@]}"

  # The single writer of `latest.json`, the only thing that signs, and the only
  # thing that publishes. Everything the updater relies on is decided here,
  # once, with all three platforms already on the release.
  publish:
    needs: [draft, build]
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      TAG: ${{ github.event.inputs.tag || github.ref_name }}
      # Taken from the job that created it rather than looked up by tag:
      # a search would have to pick one of whatever is there, which is the
      # mistake that published nothing when two releases shared a tag.
      ID: ${{ needs.draft.outputs.release_id }}
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - uses: swatinem/rust-cache@v2

      # Only for `cargo packager signer sign`: it writes the signature exactly
      # as the Tauri signer did, and the build jobs do not need the key at all.
      - name: Install cargo-packager
        run: cargo install cargo-packager --version "$CARGO_PACKAGER_VERSION" --locked

      # What the updater downloads is every file with a signature: not the
      # .dmg, which is a download only. Drafts have no tag to download by, so
      # the assets are fetched by their ids.
      - name: Fetch the updater artifacts
        run: |
          set -euo pipefail
          test -n "$ID" || { echo "no release id from the draft job" >&2; exit 1; }
          mkdir artifacts
          gh api "repos/$GITHUB_REPOSITORY/releases/$ID/assets?per_page=100" \
            --jq '.[] | select(.name | test("(\\.AppImage|\\.deb|\\.rpm|\\.msi|-setup\\.exe|\\.app\\.tar\\.gz)$")) | "\(.id) \(.name)"' \
            | while read -r asset_id name; do
                gh api -H "Accept: application/octet-stream" \
                  "repos/$GITHUB_REPOSITORY/releases/assets/$asset_id" > "artifacts/$name"
                echo "fetched $name ($(wc -c < "artifacts/$name") bytes)"
              done

      # The key is the one the Tauri build signed with, under the same secrets:
      # its public half is in every install, and an install takes only what it
      # signed. A key that is missing or is not that one fails below, before
      # anything is published.
      - name: Sign
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: crates/hangar-app/packaging/sign.sh artifacts/Hangar.AI*

      - name: Write latest.json
        run: |
          set -euo pipefail
          NOTES="$(gh api "repos/$GITHUB_REPOSITORY/releases/$ID" --jq .body)" \
          REPO="$GITHUB_REPOSITORY" \
            crates/hangar-app/packaging/latest-json.sh artifacts latest.json

      # The check nothing used to make: that what is about to be published is
      # what an install will accept. Every build an install can ask for is in
      # the feed, and every file in it verifies against the public key compiled
      # into the app, so a signing secret that is not the key the installs trust
      # keeps the release a draft instead of making an update that every install
      # refuses.
      - name: Check the release as an install will
        run: cargo run --locked -q -p hangar-update --example verify_feed -- latest.json artifacts --version "$TAG"

      # Replaced rather than added, so re-running this job is harmless.
      - name: Upload the signatures and latest.json
        run: crates/hangar-app/packaging/upload-assets.sh "$ID" artifacts/*.sig latest.json

      # Publishing is what moves the release under /releases/latest/, which
      # is where the updater polls. It happens last, with the json complete.
      # `draft` is a boolean and `make_latest` a string, per the REST API.
      - name: Publish
        run: |
          gh api -X PATCH "repos/$GITHUB_REPOSITORY/releases/$ID" \
            -F draft=false -f make_latest=true
