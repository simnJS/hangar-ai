name: CI

# The native app on every platform it ships to, and Hangar Mobile, the phone
# app it embeds. main and the native branch are checked on every push, other
# branches through their pull request.
on:
  push:
    branches: [main, feat/native-rust]
  pull_request:
  workflow_dispatch:

# A push to a branch that also has a PR open would otherwise run this twice.
# Superseded runs are cancelled instead of queueing behind each other.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  # Nothing here is ever built twice, so incremental only pays for dependency
  # tracking nobody reuses — and it is what makes the cached target directory
  # big enough for restoring it to cost more than it saves.
  CARGO_INCREMENTAL: 0

jobs:
  # Every target we ship, because most of what is platform-specific here is
  # compiled out on the others: shell discovery, the PATH repair, the pane
  # arguments, the updater's installers. A Windows-only job would let a macOS
  # or Linux build break without anyone noticing.
  rust:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest, ubuntu-22.04]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      # This job takes about twice as long on Windows as on the other two, and
      # most of the difference is Defender opening every one of the tens of
      # thousands of files cargo writes. The runner is ephemeral and already
      # runs whatever this workflow says, so scanning the build buys nothing.
      - name: Keep Defender out of the build
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          Add-MpPreference -ExclusionPath "${{ github.workspace }}"
          Add-MpPreference -ExclusionPath "$env:USERPROFILE\.cargo"
          Add-MpPreference -ExclusionProcess "rustc.exe"
          Add-MpPreference -ExclusionProcess "cargo.exe"
          Add-MpPreference -ExclusionProcess "link.exe"

      # The window itself needs nothing at build time on Linux: winit loads
      # Wayland, X11 and xkbcommon when it starts. What remains is the voice
      # stack (ALSA for cpal, clang for whisper.cpp's bindings) and WebKitGTK,
      # for the webview helper's engine only.
      #
      # Pinned to 22.04 rather than `ubuntu-latest` because the release job has
      # to be: an AppImage links against the glibc of the machine that built it,
      # and a newer one quietly stops running on older distributions. Checking
      # on the same release is what lets this job speak for the artifacts.
      - name: Install Linux build dependencies
        if: matrix.os == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libasound2-dev \
            libclang-dev \
            libssl-dev

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
          targets: wasm32-unknown-unknown

      - uses: swatinem/rust-cache@v2

      # remote/assets.rs embeds Hangar Mobile's dist-mobile/. The Rust checks
      # do not care about its contents, and the mobile job below builds it; an
      # empty folder serves the same placeholder as a missing one.
      - name: Stub the phone app bundle
        shell: bash
        run: mkdir -p dist-mobile

      # One platform is enough: formatting does not vary by OS, and running it
      # twice only makes the same failure appear twice.
      - name: Check formatting
        if: matrix.os == 'windows-latest'
        run: cargo fmt --all --check

      # clippy compiles the workspace, so a following `cargo build` would be a
      # second full pass for no extra signal. Linking is exercised by the tests
      # and by the release workflow.
      - name: Clippy
        run: cargo clippy --workspace --all-targets --locked -- -D warnings

      # A headless node builds hangar-core without its `desktop` feature: no
      # whisper.cpp, ALSA, D-Bus notifications, Discord, login item or Hangar
      # Mobile (docs/native/nodes.md). Linux is where nodes run; checked here
      # so the gates cannot rot while every other build keeps the feature.
      - name: Clippy and tests, hangar-core headless
        if: matrix.os == 'ubuntu-22.04'
        run: |
          cargo clippy -p hangar-core --no-default-features --all-targets --locked -- -D warnings
          cargo test -p hangar-core --no-default-features --locked

      # What a release ships to nodes (release.yml, `node`): hangar-node for
      # Linux arm64, cross-built with the same compiler and linker, so a break
      # of it shows here and not on the tag. Check only, nothing is packaged.
      # (The x86_64 one is the host build clippy and the tests already make.)
      - name: Check hangar-node for Linux arm64
        if: matrix.os == 'ubuntu-22.04'
        env:
          CARGO_TARGET_AARCH64_UNKNOWN_LINUX_GNU_LINKER: aarch64-linux-gnu-gcc
          CC_aarch64_unknown_linux_gnu: aarch64-linux-gnu-gcc
        run: |
          sudo apt-get install -y gcc-aarch64-linux-gnu libc6-dev-arm64-cross
          rustup target add aarch64-unknown-linux-gnu
          cargo build -p hangar-node --release --locked --target aarch64-unknown-linux-gnu

      # The engine is behind a feature so the main executable never compiles
      # a browser engine; it still has to build on every platform.
      - name: Clippy, webview helper engine
        run: cargo clippy -p hangar-webview --all-targets --features engine --locked -- -D warnings

      - name: Tests
        # Every failing test binary, not only the first: a platform difference
        # in one crate must not hide one in another.
        run: cargo test --workspace --locked --no-fail-fast
        env:
          # The views' tests draw through iced_test's headless renderer. On a
          # runner's virtual GPU (WARP, lavapipe) wgpu devices made by tests
          # running in parallel get suspended now and then; the software
          # renderer draws the same widgets with nothing to lose. The 3D
          # capture tests make their own wgpu device and are not affected.
          ICED_TEST_BACKEND: tiny-skia

  # Hangar Mobile, the phone app the desktop binary embeds, and the interface
  # strings, which are generated from JSON by Node. Node work is markedly
  # faster on Linux runners, and nothing here is platform-specific.
  mobile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm mobile:typecheck

      # The phone app's pure logic, under Node, and the desktop statistics
      # modules it shares.
      - name: Unit tests
        run: pnpm test

      # The same build the release embeds, so a phone app that no longer
      # builds is a red check on the commit rather than a failed release tag.
      - name: Build Hangar Mobile
        run: |
          pnpm mobile:build
          crates/hangar-app/packaging/check-mobile.sh

      # crates/hangar-i18n/src/generated.rs is committed so that cargo needs no
      # Node; a dictionary changed without running the generator fails here.
      - name: Interface strings are generated
        run: node crates/hangar-i18n/tools/generate.mjs --check
