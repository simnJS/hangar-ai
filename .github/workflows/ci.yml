name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# A push to a branch that also has a PR open would otherwise run this twice.
# Superseded runs are cancelled instead of queueing behind each other.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  # Nothing here is ever built twice, so incremental only pays for dependency
  # tracking nobody reuses — and it is what makes the cached target directory
  # big enough for restoring it to cost more than it saves.
  CARGO_INCREMENTAL: 0

jobs:
  # Node work is markedly faster on Linux runners, and nothing here is
  # platform-specific.
  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # `pnpm build` already runs `tsc`, so a separate typecheck step would
      # compile the whole project twice.
      - name: Typecheck and build
        run: pnpm build

      # The same command Vercel runs, so a site that will not build is a red
      # check on the commit rather than a failed production deployment nobody
      # is told about. It is what caught nothing on the day five of them went
      # out in a row: the file the build needed had never been committed, and
      # only Vercel was in a position to notice.
      - name: Build the site
        run: pnpm demo:build

  # Every target we ship, because most of what is platform-specific here is
  # compiled out on the others: shell discovery, the PATH repair, the pane
  # arguments. A Windows-only job would let a macOS or Linux build break
  # without anyone noticing.
  rust:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest, ubuntu-22.04]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      # This job takes about twice as long on Windows as on the other two, and
      # most of the difference is Defender opening every one of the tens of
      # thousands of files cargo writes. The runner is ephemeral and already
      # runs whatever this workflow says, so scanning the build buys nothing.
      - name: Keep Defender out of the build
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          Add-MpPreference -ExclusionPath "${{ github.workspace }}"
          Add-MpPreference -ExclusionPath "$env:USERPROFILE\.cargo"
          Add-MpPreference -ExclusionProcess "rustc.exe"
          Add-MpPreference -ExclusionProcess "cargo.exe"
          Add-MpPreference -ExclusionProcess "link.exe"

      # Windows and macOS ship the WebView Tauri renders through; Linux does
      # not, and `tauri-build` looks for it at compile time — so even a check
      # that never links needs these present.
      #
      # Pinned to 22.04 rather than `ubuntu-latest` because the release job has
      # to be: an AppImage links against the glibc of the machine that built it,
      # and a newer one quietly stops running on older distributions. Checking
      # on the same release is what lets this job speak for the artifacts.
      - name: Install Linux build dependencies
        if: matrix.os == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            libxdo-dev \
            libssl-dev \
            libasound2-dev \
            libclang-dev \
            patchelf

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: ./src-tauri -> target

      # tauri-build embeds whatever `frontendDist` points at. The Rust checks do
      # not care about its contents, so a placeholder saves installing Node and
      # rebuilding the bundle the frontend job already produced.
      - name: Stub frontend bundle
        shell: bash
        run: mkdir -p dist && touch dist/index.html

      # One platform is enough: formatting does not vary by OS, and running it
      # twice only makes the same failure appear twice.
      - name: Check formatting
        if: matrix.os == 'windows-latest'
        working-directory: src-tauri
        run: cargo fmt --check

      # clippy compiles the crate, so a following `cargo build` would be a
      # second full pass over ~400 dependencies for no extra signal. Linking is
      # exercised by the release workflow.
      - name: Clippy
        working-directory: src-tauri
        run: cargo clippy --all-targets --locked -- -D warnings

      - name: Tests
        working-directory: src-tauri
        run: cargo test --locked
