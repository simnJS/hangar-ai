name: Native

# The native rewrite (docs/native/PLAN.md) on its own branch, until it replaces
# the Tauri app and ci.yml with it. ci.yml only runs on main and on pull
# requests, so pushes to the rewrite would otherwise go unchecked.
on:
  push:
    branches: [feat/native-rust]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  # Same reasoning as ci.yml: nothing is built twice on a runner.
  CARGO_INCREMENTAL: 0

jobs:
  rust:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest, ubuntu-22.04]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Keep Defender out of the build
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          Add-MpPreference -ExclusionPath "${{ github.workspace }}"
          Add-MpPreference -ExclusionPath "$env:USERPROFILE\.cargo"
          Add-MpPreference -ExclusionProcess "rustc.exe"
          Add-MpPreference -ExclusionProcess "cargo.exe"
          Add-MpPreference -ExclusionProcess "link.exe"

      # The window itself needs nothing at build time on Linux: winit loads
      # Wayland, X11 and xkbcommon when it starts. What remains is the voice
      # stack (ALSA for cpal, clang for whisper.cpp's bindings) and WebKitGTK,
      # for the webview helper's engine only.
      - name: Install Linux build dependencies
        if: matrix.os == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libasound2-dev \
            libclang-dev \
            libssl-dev

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
          targets: wasm32-unknown-unknown

      - uses: swatinem/rust-cache@v2

      # remote/assets.rs embeds Hangar Mobile's dist-mobile/; an empty folder
      # serves the same placeholder as a missing one.
      - name: Stub the phone app bundle
        shell: bash
        run: mkdir -p dist-mobile

      - name: Check formatting
        if: matrix.os == 'windows-latest'
        run: cargo fmt --all --check

      - name: Clippy
        run: cargo clippy --workspace --all-targets --locked -- -D warnings

      # The engine is behind a feature so the main executable never compiles
      # a browser engine; it still has to build on every platform.
      - name: Clippy, webview helper engine
        run: cargo clippy -p hangar-webview --all-targets --features engine --locked -- -D warnings

      - name: Tests
        run: cargo test --workspace --locked
