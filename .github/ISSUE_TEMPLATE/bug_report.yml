name: Bug report
description: Something in Hangar.AI does not work as it should.
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting a bug. For a security problem, do not use this form: see [SECURITY.md](https://github.com/hangar-ai/hangar/blob/main/SECURITY.md).

  - type: input
    id: version
    attributes:
      label: Hangar version
      description: Shown at the top of the navigator, and in Settings.
      placeholder: "2.0.0"
    validations:
      required: true

  - type: dropdown
    id: generation
    attributes:
      label: Native app or 1.x
      description: Hangar 2.0 and later are the native app, rewritten in Rust; 1.x is the web-view app it replaced.
      options:
        - Hangar 2.0 or later (native)
        - Hangar 1.x
    validations:
      required: true

  - type: dropdown
    id: os
    attributes:
      label: Operating system
      options:
        - Windows
        - macOS
        - Linux
    validations:
      required: true

  - type: input
    id: os-version
    attributes:
      label: OS version and install type
      description: For example "Windows 11 24H2", "macOS 15.4 on Apple Silicon", "Ubuntu 24.04, GNOME on Wayland, AppImage". On Linux, say whether the session is Wayland or X11.
    validations:
      required: true

  - type: dropdown
    id: agents
    attributes:
      label: Pane
      description: What were the affected panes running?
      multiple: true
      options:
        - Claude Code
        - Plain shell
        - Not pane-specific
    validations:
      required: true

  - type: input
    id: agent-version
    attributes:
      label: Claude Code version and shell
      description: The output of `claude --version`, and the pane's shell (PowerShell, Git Bash, WSL, zsh…).
      placeholder: "Claude Code 2.1.311, PowerShell 7.5"

  - type: dropdown
    id: area
    attributes:
      label: Area
      options:
        - Terminals and panes
        - Orchestrator, workers or deliveries
        - Task board
        - Memory
        - MCP server or agent configuration
        - Usage statistics
        - Workspaces, sleep or worktrees
        - Kits and kit tabs (HTML or native)
        - File previews, PDFs or web pages
        - 3D preview
        - Dictation
        - Hangar Mobile
        - Install or update, or data coming from 1.x
        - Something else

  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Create a workspace on a git repository with two Claude Code panes
        2. …
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: What you expected
    validations:
      required: true

  - type: textarea
    id: actual
    attributes:
      label: What happened instead
      description: Include any error message as text.
    validations:
      required: true

  - type: textarea
    id: extra
    attributes:
      label: Screenshots, logs or other context
      description: Please remove tokens, keys and private paths before you paste anything.
