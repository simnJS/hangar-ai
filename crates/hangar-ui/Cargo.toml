[package]
name = "hangar-ui"
description = "Hangar's own widgets on iced: icons, buttons, menus, dialogs, the command palette"
version.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
edition = "2024"

[dependencies]
iced.workspace = true
hangar-theme.workspace = true
unicode-normalization.workspace = true

[dev-dependencies]
# Scratch folders the tests make, removed when the test ends (panic included).
tempfile = "3"
# Only to check that every icon is an SVG a renderer can read.
usvg.workspace = true
# A headless window to drive the widgets with real events.
iced_test.workspace = true
# Reads back the pictures the simulator draws, to look at their pixels.
png.workspace = true
