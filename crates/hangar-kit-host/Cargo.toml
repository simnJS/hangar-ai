[package]
name = "hangar-kit-host"
description = "Runs kits' WebAssembly tabs, sandboxed, and draws their widget trees with iced"
version.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
edition = "2024"

# A kit's widgets are drawn in the theme in use, with hangar-ui's buttons,
# icons, tooltips and menus, and the words Hangar says itself in the person's
# language (render/style.rs).
[dependencies]
hangar-kit-ui.workspace = true
hangar-theme.workspace = true
hangar-ui.workspace = true
hangar-i18n.workspace = true
iced.workspace = true
wasmtime.workspace = true
serde.workspace = true
serde_json.workspace = true
# `canvas.export` (paint.rs): a canvas's marks over its background, drawn off
# screen and written as a PNG; and the pictures a tab holds (`files.pick`,
# `ui.pasteImage`) read for their size.
tiny-skia.workspace = true
ab_glyph.workspace = true
image.workspace = true
png.workspace = true
base64.workspace = true
# The person's time zone, which a tab starts with (`Start::utc_offset`):
# wasm32 has none.
chrono.workspace = true

[dev-dependencies]
# Drives the widgets that are hangar-ui's as a person would (render/tests.rs).
iced_test.workspace = true
