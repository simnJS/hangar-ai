[package]
name = "hangar-kit-host"
description = "Runs kits' WebAssembly tabs, sandboxed, and draws their widget trees with iced"
version.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
edition = "2024"

# A kit's widgets are drawn in the theme in use, with hangar-ui's buttons,
# icons, tooltips and menus, and the words Hangar says itself in the person's
# language (render/style.rs).
[dependencies]
hangar-kit-ui.workspace = true
hangar-theme.workspace = true
hangar-ui.workspace = true
hangar-i18n.workspace = true
iced.workspace = true
wasmtime.workspace = true
serde.workspace = true
serde_json.workspace = true
