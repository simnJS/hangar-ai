[package]
name = "hangar-app"
description = "Terminal multiplexer for Claude Code, with a shared task board"
version.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
edition = "2024"

# The executable keeps the old name: agent configs and the MCP install point
# at `hangar-ai`, and `hangar-ai --mcp` must keep answering there.
[[bin]]
name = "hangar-ai"
path = "src/main.rs"

# `hangar-ui`, `hangar-kit-host` and `hangar-model3d` are not here yet, on
# purpose: they are being built in parallel, the views draw placeholders until
# they land (`TODO(hangar-ui)` and the like mark the places). PACKAGES.md says
# who adds each.
[dependencies]
hangar-core.workspace = true
hangar-theme.workspace = true
hangar-i18n.workspace = true
hangar-term.workspace = true
# Declared once here, before the packages start, so two of them adding the
# same crate never collide in this file (docs/native/AGENT_BRIEF.md).
hangar-ui.workspace = true
hangar-kit-ui.workspace = true
hangar-kit-host.workspace = true
hangar-webview.workspace = true
hangar-model3d.workspace = true
hangar-update.workspace = true
iced.workspace = true
# The development screenshot draws the main window's view off screen
# (shell/dev_screenshot.rs).
iced_runtime.workspace = true
tokio.workspace = true
dirs.workspace = true
serde.workspace = true
serde_json.workspace = true
rfd.workspace = true
open.workspace = true
png.workspace = true
two-face.workspace = true
syntect.workspace = true
# The requests a page makes to the helper's scheme, served by hangar-core.
http.workspace = true
uuid.workspace = true
# Wall-clock dates of the memory view, the local days, weeks and hours of the
# statistics page (as `Intl.DateTimeFormat` wrote them), the dates of the
# settings' Hangar Mobile page, the navigator's plan resets and the times in the orchestration briefings;
# the same build hangar-core already uses.
chrono.workspace = true
# The orchestration engine (P19): plan statuses, and task titles folded to
# ASCII for branch names.
regex.workspace = true
unicode-normalization.workspace = true
# The 3D view (P17): a capture copied to the clipboard as a picture, and saved
# through hangar-core's `model_save_png`, which takes it as base64.
arboard.workspace = true
base64.workspace = true
# The 2D viewers (P15, package F): the frames of an animated GIF or WebP, and
# the AVIF files iced's image feature cannot read.
image.workspace = true
avif-parse.workspace = true
re_rav1d.workspace = true
# The version iced's SVG renderer builds: it tells an SVG that cannot be read
# from one that has no size, which the renderer reports the same way, and the
# tests check that every glyph of the preview is an SVG a renderer can read.
usvg.workspace = true

[dev-dependencies]
# Scratch folders the tests make, removed when the test ends (panic included).
tempfile = "3"
# Draws a package's views without a window, for the snapshot tests packages keep
# to look at what they built (kits/views/snapshot.rs), and drives the preview's
# views with real events.
iced_test.workspace = true
# The AVIF encoder (iced's image feature builds it already), to make the files
# the AVIF reader of the preview is tested on.
image = { workspace = true, features = ["avif"] }

# The Windows executable's icon and version information (build.rs). Only a
# Windows host compiles the resource, so it is only a build dependency there.
[target.'cfg(windows)'.build-dependencies]
winresource = "0.1"

# ---------------------------------------------------------------------------
# Packaging (docs/native/PACKAGING.md)
#
# Read by `cargo packager` (cargo-packager, Tauri's bundler extracted from it),
# which makes the Linux AppImage and .deb and the macOS .app and .dmg. Paths are
# relative to this folder. The version, description, authors and executable
# names come from the package itself, so a release bumps one number.
#
# The values that an install of the old Tauri app already knows are kept as they
# were, because the installers and the updater match on them: the identifier,
# the product name, the executable name and the Debian package name.
# ---------------------------------------------------------------------------
[package.metadata.packager]
productName = "Hangar.AI"
identifier = "com.simnjs.iabench"
publisher = "simnjs"
homepage = "https://github.com/hangar-ai/hangar"
category = "DeveloperTool"
longDescription = """
Hangar runs Claude Code and shells side by side, each in a real terminal pane, around a shared task board and memory that every Claude Code reads and writes over Hangar's MCP server."""
# The PNGs are the Linux ones (the .deb puts each in the hicolor folder of its
# size, the AppImage takes the largest): a rounded tile with room around it, as
# GNOME and KDE draw app icons, rendered from packaging/icons/linux/hangar-ai.svg.
icons = [
  "packaging/icons/linux/16x16.png",
  "packaging/icons/linux/24x24.png",
  "packaging/icons/linux/32x32.png",
  "packaging/icons/linux/48x48.png",
  "packaging/icons/linux/64x64.png",
  "packaging/icons/linux/128x128.png",
  "packaging/icons/linux/256x256.png",
  "packaging/icons/linux/512x512.png",
  "packaging/icons/icon.icns",
  "packaging/icons/icon.ico",
]
# The helper that shows HTML kit tabs and PDFs is looked for next to the main
# executable (hangar_webview::find_helper), and every format puts all of the
# binaries in the one folder: usr/bin, Contents/MacOS, the install folder.
#
# The two `hangar-node-<arch>` files are the headless node daemon built for
# Linux x86_64 and arm64, which the desktop uploads to a node over SSH
# (hangar_app::nodes::model::BinarySource looks for them in this same folder).
# They are not built by this package: the release workflow builds them with
# `-p hangar-node` and packaging/common.sh's stage_node_binaries puts them in the
# folder the packager reads, whatever the platform it packages for. On macOS the
# packager only codesigns files with a Mach-O header, so these ELF files are
# copied and left alone (docs/native/PACKAGING.md, "hangar-node").
binaries = [
  { path = "hangar-ai", main = true },
  { path = "hangar-webview" },
  { path = "hangar-node-x86_64" },
  { path = "hangar-node-aarch64" },
]

[package.metadata.packager.deb]
# `dpkg -i` upgrades the package of the same name, so this one has to stay what
# the Tauri build called it (its product name in kebab case).
packageName = "hangar-ai"
section = "devel"
# What the two executables link against, by the names Debian and Ubuntu give
# them (24.04 renamed several to `...t64`, which still provide the old name).
# WebKitGTK and GTK are for the webview helper only, and were already depended on
# by the Tauri build; HTML kit tabs and PDF previews need them.
depends = [
  "libc6",
  "libstdc++6",
  "libasound2t64 | libasound2",
  "libgtk-3-0t64 | libgtk-3-0",
  "libwebkit2gtk-4.1-0",
]
# Has no placeholders, so the packager copies it as it is; the .rpm below
# installs the same file. StartupWMClass is the window class the compositor
# matches windows to.
desktopTemplate = "packaging/linux/hangar-ai.desktop"
# The scalable icon, which docks draw at whatever size they need.
files = { "packaging/icons/linux/hangar-ai.svg" = "usr/share/icons/hicolor/scalable/apps/hangar-ai.svg" }

[package.metadata.packager.appimage]
# The host provides every library (see docs/native/PACKAGING.md, "AppImage"):
# the GPU stack cannot be bundled, and WebKitGTK cannot be moved from where it
# looks for its own helper processes. The pattern is quoted twice because the
# packager pastes it into a shell script, where a bare `*` becomes a file list.
excludedLibs = ["'*'"]

[package.metadata.packager.macos]
minimumSystemVersion = "10.15"
# Merged into the generated Info.plist: the microphone usage description that
# dictation needs, or macOS kills the app the first time it records.
infoPlistPath = "packaging/macos/Info.plist"

[package.metadata.packager.dmg]
# The Tauri bundler's window, so the disk image looks as it did.
windowSize = { width = 660, height = 400 }

# ---------------------------------------------------------------------------
# The .rpm, which cargo-packager does not make: `cargo generate-rpm -p
# crates/hangar-app` (cargo-generate-rpm writes the package itself, with no
# rpmbuild). `name` keeps the Tauri build's package name (its product name, with
# the dot), which is what `rpm -U` matches an upgrade on. Asset sources are
# relative to the repository root.
# ---------------------------------------------------------------------------
[package.metadata.generate-rpm]
name = "Hangar.AI"
license = "MIT"
summary = "Terminal multiplexer for CLI coding agents, with a shared task board"
url = "https://github.com/hangar-ai/hangar"
# The default is to run ldd on the build machine and require every library it
# finds, with the versions of the symbols used: a few hundred requirements that
# only the machine that built the package satisfies (a Fedora has other sonames
# for ICU and a different set of GStreamer libraries). The ones that matter are
# listed below instead, by soname, which every distribution's packages provide
# under whatever name they use.
auto-req = "no"
require-sh = false
assets = [
  { source = "target/dist/hangar-ai", dest = "/usr/bin/hangar-ai", mode = "755" },
  { source = "target/dist/hangar-webview", dest = "/usr/bin/hangar-webview", mode = "755" },
  { source = "target/dist/hangar-node-x86_64", dest = "/usr/bin/hangar-node-x86_64", mode = "755" },
  { source = "target/dist/hangar-node-aarch64", dest = "/usr/bin/hangar-node-aarch64", mode = "755" },
  { source = "crates/hangar-app/packaging/linux/hangar-ai.desktop", dest = "/usr/share/applications/hangar-ai.desktop", mode = "644" },
  { source = "crates/hangar-app/packaging/icons/linux/16x16.png", dest = "/usr/share/icons/hicolor/16x16/apps/hangar-ai.png", mode = "644" },
  { source = "crates/hangar-app/packaging/icons/linux/24x24.png", dest = "/usr/share/icons/hicolor/24x24/apps/hangar-ai.png", mode = "644" },
  { source = "crates/hangar-app/packaging/icons/linux/32x32.png", dest = "/usr/share/icons/hicolor/32x32/apps/hangar-ai.png", mode = "644" },
  { source = "crates/hangar-app/packaging/icons/linux/48x48.png", dest = "/usr/share/icons/hicolor/48x48/apps/hangar-ai.png", mode = "644" },
  { source = "crates/hangar-app/packaging/icons/linux/64x64.png", dest = "/usr/share/icons/hicolor/64x64/apps/hangar-ai.png", mode = "644" },
  { source = "crates/hangar-app/packaging/icons/linux/128x128.png", dest = "/usr/share/icons/hicolor/128x128/apps/hangar-ai.png", mode = "644" },
  { source = "crates/hangar-app/packaging/icons/linux/256x256.png", dest = "/usr/share/icons/hicolor/256x256/apps/hangar-ai.png", mode = "644" },
  { source = "crates/hangar-app/packaging/icons/linux/512x512.png", dest = "/usr/share/icons/hicolor/512x512/apps/hangar-ai.png", mode = "644" },
  { source = "crates/hangar-app/packaging/icons/linux/hangar-ai.svg", dest = "/usr/share/icons/hicolor/scalable/apps/hangar-ai.svg", mode = "644" },
]

# What the two executables need from the system, as the .deb's Depends lists it.
# GTK and WebKitGTK are for the webview helper only (HTML kit tabs, PDF previews);
# the Tauri build's .rpm required them too (as webkit2gtk4.1 and gtk3).
[package.metadata.generate-rpm.requires]
"libasound.so.2()(64bit)" = "*"
"libstdc++.so.6()(64bit)" = "*"
"libgtk-3.so.0()(64bit)" = "*"
"libwebkit2gtk-4.1.so.0()(64bit)" = "*"
