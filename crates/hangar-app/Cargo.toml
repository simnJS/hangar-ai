[package]
name = "hangar-app"
description = "Terminal multiplexer for CLI coding agents, with a shared task board"
version.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
edition = "2024"

# The executable keeps the old name: agent configs and the MCP install point
# at `hangar-ai`, and `hangar-ai --mcp` must keep answering there.
[[bin]]
name = "hangar-ai"
path = "src/main.rs"

# `hangar-ui`, `hangar-kit-host` and `hangar-model3d` are not here yet, on
# purpose: they are being built in parallel, the views draw placeholders until
# they land (`TODO(hangar-ui)` and the like mark the places). PACKAGES.md says
# who adds each.
[dependencies]
hangar-core.workspace = true
hangar-theme.workspace = true
hangar-i18n.workspace = true
hangar-term.workspace = true
# Declared once here, before the packages start, so two of them adding the
# same crate never collide in this file (docs/native/AGENT_BRIEF.md).
hangar-ui.workspace = true
hangar-kit-ui.workspace = true
hangar-kit-host.workspace = true
hangar-webview.workspace = true
hangar-model3d.workspace = true
hangar-update.workspace = true
iced.workspace = true
tokio.workspace = true
serde.workspace = true
serde_json.workspace = true
rfd.workspace = true
open.workspace = true
png.workspace = true
two-face.workspace = true
syntect.workspace = true
# The requests a page makes to the helper's scheme, served by hangar-core.
http.workspace = true
uuid.workspace = true
# Wall-clock dates of the memory view, the local days, weeks and hours of the
# statistics page (as `Intl.DateTimeFormat` wrote them), the dates of the
# settings' Hangar Mobile page, the navigator's plan resets and the times in the orchestration briefings;
# the same build hangar-core already uses.
chrono.workspace = true
# The orchestration engine (P19): plan statuses, and task titles folded to
# ASCII for branch names.
regex.workspace = true
unicode-normalization.workspace = true
# The 3D view (P17): a capture copied to the clipboard as a picture, and saved
# through hangar-core's `model_save_png`, which takes it as base64.
arboard.workspace = true
base64.workspace = true

[dev-dependencies]
# Draws a package's views without a window, for the snapshot tests packages keep
# to look at what they built (kits/views/snapshot.rs), and drives the preview's
# views with real events.
iced_test.workspace = true
# Only to check that every glyph of the preview is an SVG a renderer can read.
usvg.workspace = true
