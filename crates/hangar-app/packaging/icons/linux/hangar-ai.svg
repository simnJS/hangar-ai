<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024" role="img" aria-label="Hangar.AI">
  <!-- The Linux launcher icon: assets/logo.svg on a rounded tile with room
       around it, the shape GNOME and KDE give their own app icons. The PNGs
       next to it are rendered from this file (render.sh). -->
  <defs>
    <linearGradient id="tile" x1="0" y1="0" x2="0.42" y2="1">
      <stop offset="0" stop-color="#2a2e45" />
      <stop offset="1" stop-color="#15161f" />
    </linearGradient>
    <linearGradient id="sheen" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.07" />
      <stop offset="0.5" stop-color="#ffffff" stop-opacity="0" />
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="18" />
    </filter>
  </defs>
  <rect x="100" y="112" width="824" height="824" rx="184" fill="#000000" fill-opacity="0.38" filter="url(#shadow)" />
  <rect x="100" y="92" width="824" height="824" rx="184" fill="url(#tile)" />
  <rect x="100" y="92" width="824" height="824" rx="184" fill="url(#sheen)" />
  <rect x="103" y="95" width="818" height="818" rx="181" fill="none" stroke="#ffffff" stroke-opacity="0.1" stroke-width="6" />
  <rect x="261" y="253" width="209" height="502" rx="20" fill="#7aa2f7" />
  <rect x="533" y="253" width="230" height="209" rx="20" fill="#c0caf5" />
  <rect x="533" y="525" width="230" height="230" rx="20" fill="#c0caf5" />
</svg>
