[package]
name = "hangar-node"
description = "The headless daemon a Hangar node runs: the panes' terminals and the agents' API, driven from the desktop over SSH"
version.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
edition = "2021"

# docs/native/nodes.md, sections 2 and 3. Linux only: built for any other
# system, the binary says so and exits (main.rs).
[[bin]]
name = "hangar-node"
path = "src/main.rs"

[target.'cfg(target_os = "linux")'.dependencies]
# Without `desktop`: no whisper, ALSA, notifications, Discord or Hangar Mobile
# on a server (hangar-core's Cargo.toml, headless.rs).
# A path rather than the workspace entry: that one keeps the default features.
hangar-core = { path = "../hangar-core", default-features = false }
# `ws` for this crate alone: the panes' streams and the events are WebSockets.
axum = { version = "0.8.9", default-features = false, features = ["http1", "json", "query", "tokio", "ws"] }
tokio = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
dirs = { workspace = true }
# The `/api/*` routes relayed to core's own server (proxy.rs): the versions
# hangar-core's axum already builds.
hyper = { version = "1", features = ["client", "http1"] }
hyper-util = { version = "0.1", features = ["tokio"] }
http-body-util = "0.1"
# The node's token compared in constant time, as core compares its own.
subtle = "2.6"
# setsid, flock, gethostname, kill(pid, 0).
libc = "0.2"

[target.'cfg(target_os = "linux")'.dev-dependencies]
# A WebSocket client for the tests, the one axum's `ws` serves with.
tokio-tungstenite = "0.29"
futures-util = { version = "0.3", default-features = false, features = ["sink", "std"] }
tempfile = "3"
