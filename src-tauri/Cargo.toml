[package]
name = "hangar-ai"
version = "0.3.0"
description = "Terminal multiplexer for CLI coding agents, with a shared task board"
authors = ["simnJS"]
license = "MIT"
repository = "https://github.com/simnJS/hangar-ai"
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "hangar_ai_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
portable-pty = "0.9.0"
tauri-plugin-dialog = "2.7.2"
dirs = "6.0.0"
uuid = { version = "1.24.0", features = ["v4", "serde"] }
axum = { version = "0.8.9", default-features = false, features = ["http1", "json", "query", "tokio"] }
tokio = { version = "1.53.1", features = ["rt-multi-thread", "macros", "sync"] }
ureq = { version = "3.3.0", default-features = false, features = ["json"] }
toml_edit = "0.25.13"
tauri-plugin-updater = "2.10.1"
tauri-plugin-process = "2.3.1"
tauri-plugin-notification = "2.3.1"
discord-rich-presence = "1.1.0"

